
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | Kitchen Equipment Store</title>

    <link rel="stylesheet" href="css/register.css">
</head>
<body>

    <div class="register-container">

        <div class="register-image">
            <div class="image-content">
                <h1>Kitchen Equipment Store</h1>
                <p>Everything You Need for Your Kitchen.</p>
            </div>
        </div>

        <div class="register-form">

            <h2>Create Account</h2>
            <p class="subtitle">Join us and explore our kitchen collection.</p>

            <form id="registerForm">

                <div class="input-row">

                    <div class="input-group">
                        <label>First Name</label>
                        <input type="text" id="firstName"
                            placeholder="Enter first name" required>
                    </div>

                    <div class="input-group">
                        <label>Last Name</label>
                        <input type="text" id="lastName"
                            placeholder="Enter last name" required>
                    </div>

                </div>

                <div class="input-group">
                    <label>Email Address</label>
                    <input type="email" id="email"
                        placeholder="Enter email address" required>
                </div>

                <div class="input-group">
                    <label>Password</label>
                    <input type="password" id="password"
                        placeholder="Create password" required minlength="6">
                </div>

                <div class="input-group">
                    <label>Confirm Password</label>
                    <input type="password" id="confirmPassword"
                        placeholder="Confirm password" required>
                </div>

                <div class="input-group">
                    <label>User Type</label>

                    <select id="userType" required>
                        <option value="" disabled selected>Select User Type</option>
                        <option value="admin">Admin</option>
                        <option value="client">Client</option>
                    </select>
                </div>

                <button type="submit" id="registerBtn">
                    Create Account
                </button>

                <p id="message"></p>

            </form>

            <p class="login-link">
                Already have an account?
                <a href="login.html">Login</a>
            </p>

        </div>

    </div>

    <script src="js/register.js"></script>

</body>
</html>
