<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile | Kitchen Store</title>
    <link rel="stylesheet" href="css/profile.css">
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar">
        <a href="home.html" class="logo">Kitchen<span>Store</span></a>

        <div class="nav-links">
            <a href="home.html">Home</a>
            <a href="products-list.html">Products</a>
            <a href="cart.html">Cart</a>
            <a href="my-orders.html">My Orders</a>
            <a href="contact.html">Contact Us</a>
            <a href="profile.html" class="active">My Profile</a>
            <span id="customerName"></span>
            <button onclick="logout()">Logout</button>
        </div>
    </nav>

    <!-- Profile Section -->
    <section class="profile-section">

        <div class="page-heading">
            <h1>My Profile</h1>
            <p>View and update your personal information.</p>
        </div>

        <div class="profile-card">

            <div class="profile-header">
                <div class="profile-icon">👤</div>
                <h2 id="profileName">Customer Name</h2>
                <p id="profileEmail">customer@email.com</p>
            </div>

            <form id="profileForm">

                <div class="form-row">

                    <div class="form-group">
                        <label>First Name</label>
                        <input type="text" id="firstName" required>
                    </div>

                    <div class="form-group">
                        <label>Last Name</label>
                        <input type="text" id="lastName" required>
                    </div>

                </div>

                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="email" required>
                </div>

                <div class="form-group">
                    <label>New Password</label>
                    <input type="password" id="password"
                           placeholder="Leave blank to keep current password">
                </div>

                <div class="form-group">
                    <label>Confirm New Password</label>
                    <input type="password" id="confirmPassword"
                           placeholder="Confirm your new password">
                </div>

                <button type="submit" id="saveBtn">Save Changes</button>

            </form>

        </div>

    </section>

    <footer>
        <p>© 2026 Kitchen Store. All Rights Reserved.</p>
    </footer>

    <script src="js/profile.js"></script>
</body>
</html>
