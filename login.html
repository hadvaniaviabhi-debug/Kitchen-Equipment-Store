<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Kitchen Equipment Store</title>

    <link rel="stylesheet" href="css/login.css">
</head>
<body>

    <div class="login-container">

        <!-- Left Image Section -->
        <div class="login-image">
            <div class="image-content">
                <h1>Kitchen Equipment Store</h1>
                <p>Everything You Need for Your Kitchen.</p>
            </div>
        </div>

        <!-- Right Login Section -->
        <div class="login-form">

            <div class="brand">KITCHEN STORE</div>

            <h2>Welcome Back!</h2>

            <p class="subtitle">
                Login to continue your shopping experience.
            </p>

            <form id="loginForm">

                <div class="input-group">
                    <label for="email">Email Address</label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        autocomplete="email"
                        required
                    >
                </div>

                <div class="input-group">
                    <label for="password">Password</label>

                    <div class="password-box">

                        <input
                            type="password"
                            id="password"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required
                        >

                        <button
                            type="button"
                            id="togglePassword"
                            class="toggle-password"
                        >
                            Show
                        </button>

                    </div>
                </div>

                <button type="submit" class="login-btn" id="loginBtn">
                    Login
                </button>

                <p id="message" role="status"></p>

            </form>

            <p class="register-link">
                Don't have an account?
                <a href="register.html">Create Account</a>
            </p>

            <div class="footer-text">
                © 2026 Kitchen Equipment Store
            </div>

        </div>

    </div>

    <script src="js/login.js"></script>

</body>
</html>
