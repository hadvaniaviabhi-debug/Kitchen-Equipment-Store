<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout | Kitchen Store</title>
    <link rel="stylesheet" href="css/checkout.css">
</head>
<body>

    <nav class="navbar">
        <a href="home.html" class="logo">Kitchen<span>Store</span></a>

        <div class="nav-links">
            <a href="home.html">Home</a>
            <a href="products-list.html">Products</a>
            <a href="cart.html">Cart</a>
            <span id="customerName"></span>
            <button onclick="logout()">Logout</button>
        </div>
    </nav>

    <section class="checkout-section">

        <div class="page-heading">
            <h1>Checkout</h1>
            <p>Complete your order details below</p>
        </div>

        <div class="checkout-layout">

            <!-- Customer Details -->
            <div class="checkout-form">

                <h2>Delivery Information</h2>

                <form id="checkoutForm">

                    <label>Full Name</label>
                    <input type="text" id="fullName" required>

                    <label>Email Address</label>
                    <input type="email" id="email" required>

                    <label>Phone Number</label>
                    <input type="tel" id="phone" required
                           pattern="[0-9]{10}"
                           maxlength="10"
                           placeholder="10 digit mobile number">

                    <label>Delivery Address</label>
                    <textarea id="address" rows="4"
                              placeholder="Enter your full address"
                              required></textarea>

                    <label>City</label>
                    <input type="text" id="city" required>

                    <label>Postal Code</label>
                    <input type="text" id="postalCode"
                           pattern="[0-9]{6}"
                           maxlength="6"
                           placeholder="6 digit postal code"
                           required>

                    <label>Payment Method</label>
                    <select id="paymentMethod" required>
                        <option value="">Select Payment Method</option>
                        <option value="Cash on Delivery">Cash on Delivery</option>
                        <option value="Online Payment">Online Payment</option>
                    </select>

                    <button type="submit" id="placeOrderBtn">
                        Place Order
                    </button>

                </form>

            </div>

            <!-- Order Summary -->
            <div class="order-summary">

                <h2>Your Order</h2>

                <div id="checkoutItems"></div>

                <hr>

                <div class="summary-row">
                    <span>Subtotal</span>
                    <span id="subtotal">₹0</span>
                </div>

                <div class="summary-row">
                    <span>Shipping</span>
                    <span>Free</span>
                </div>

                <div class="summary-row total-row">
                    <span>Total</span>
                    <span id="total">₹0</span>
                </div>

            </div>

        </div>

    </section>

    <footer>
        <p>© 2026 Kitchen Store. All Rights Reserved.</p>
    </footer>

    <script src="js/checkout.js"></script>
</body>
</html>
