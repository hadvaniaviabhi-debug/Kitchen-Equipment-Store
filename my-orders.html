<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Orders | Kitchen Store</title>
    <link rel="stylesheet" href="css/my-orders.css">
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar">
        <a href="home.html" class="logo">Kitchen<span>Store</span></a>

        <div class="nav-links">
            <a href="home.html">Home</a>
            <a href="products-list.html">Products</a>
            <a href="cart.html">Cart</a>
            <a href="my-orders.html" class="active">My Orders</a>
            <a href="contact.html">Contact Us</a>
            <a href="profile.html">My Profile</a>
            <span id="customerName"></span>
            <button onclick="logout()">Logout</button>
        </div>
    </nav>

    <!-- Orders Section -->
    <section class="orders-section">

        <div class="page-heading">
            <h1>My Orders</h1>
            <p>Track and manage your kitchen equipment orders.</p>
        </div>

        <div class="orders-container">

            <div class="orders-header">
                <h2>Order History</h2>
                <span id="totalOrders">0 Orders</span>
            </div>

            <div id="ordersContainer"></div>

        </div>

    </section>

    <!-- Order Details Modal -->
    <div class="modal" id="orderModal">

        <div class="modal-content">

            <button class="close-btn" onclick="closeModal()">×</button>

            <h2>Order Details</h2>

            <div id="orderDetails"></div>

        </div>

    </div>

    <footer>
        <p>© 2026 Kitchen Store. All Rights Reserved.</p>
    </footer>

    <script src="js/my-orders.js"></script>
</body>
</html>
